# /ingest Worker (P1-BE-01). Not deployed yet: Idan creates the Cloudflare account first
# (docs/setup/accounts.md §6). Deploys only from CI on tags (GDD §10 Operations).
name = "rushwarden-api"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = false

# Collection is off until the privacy policy is published (ADR-007). Flip to "true" only then.
# ADR-025 point 4: no Workers Logs and no Logpush for the analytics Worker. The code never logs
# request bodies, IP addresses or install IDs either.
logpush = false

[observability]
enabled = false

[vars]
INGEST_ENABLED = "false"
ALLOWED_ORIGINS = "https://*.itch.zone"

[[d1_databases]]
binding = "DB"
database_name = "rushwarden"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

# ADR-025: daily roll-up of yesterday (no install IDs, 10-install floor), then deletion of raw
# events older than 90 days. 02:30 UTC.
[triggers]
crons = ["30 2 * * *"]

# Keyed by install ID in code, never by IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Secret, set with `wrangler secret put STATS_TOKEN` (never in this file): STATS_TOKEN
