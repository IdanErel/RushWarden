name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit, golden (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests with coverage gates, including golden hashes on Node
        run: pnpm test

  # P1-SIM-06: headless throughput against the GDD section 3 budget (2,000 rounds/s at 150
  # vehicles). Report only (Lead decision): never gates a merge; numbers go to the job summary.
  sim-bench:
    name: Sim throughput (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bench (one run)
        run: pnpm --filter @rushwarden/sim exec vitest bench --run --outputJson "$RUNNER_TEMP/sim-bench.json"
      - name: Rounds/s to the job summary
        run: node packages/sim/bench/summary.mjs "$RUNNER_TEMP/sim-bench.json" "$GITHUB_STEP_SUMMARY"

  golden-browsers:
    name: Golden hashes (Chromium, WebKit, Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rushwarden/golden exec playwright install --with-deps chromium webkit firefox
      - run: pnpm golden:browsers

  web:
    # Name kept as is, so a required check of this name still applies. The run screen e2e moved
    # to the ui-e2e job (it took ~7 of this job's ~14.5 min against a 15 min timeout).
    # Without it this job takes ~7.5 min; the timeout is ~2× that.
    name: Web build, size budget, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and check bundle budget
        run: pnpm size
      - run: pnpm --filter @rushwarden/platform-web exec playwright install --with-deps chromium
      # Fast specs only; the @full toy specs (whole rounds and runs) are in the toy-e2e job (ADR-029).
      - name: E2E (phone and desktop viewports)
        run: pnpm --filter @rushwarden/platform-web run e2e --grep-invert @full
      - name: Renderer dev-page check (scene, worker playback, readability effects)
        run: pnpm --filter @rushwarden/render run e2e
      # P1-PLT-01: itch HTML5 zip (itch flavour, size-, map- and hook-checked). Builds to its own dir.
      - name: Package itch zip
        run: pnpm --filter @rushwarden/platform-web run package:itch
      # P1-PLT-01: the zip itself boots from an itch-like subfolder in a 390×844 iframe and plays a round.
      - name: Itch zip smoke test
        run: pnpm --filter @rushwarden/platform-web run e2e:itch
      - uses: actions/upload-artifact@v4
        with:
          name: rushwarden-itch-${{ github.sha }}
          path: packages/platform-web/itch/rushwarden-itch.zip
          if-no-files-found: error
          retention-days: 14
      # P1-PLT-02: Poki and CrazyGames zips (also checked for unapproved URLs and ad API calls).
      - name: Package Poki and CrazyGames zips
        run: |
          pnpm --filter @rushwarden/platform-web run package:poki
          pnpm --filter @rushwarden/platform-web run package:crazygames
      # P1-PLT-02: each zip plays a run against a stub SDK that records every call (GDD §9).
      - name: Portal zip SDK test
        run: pnpm --filter @rushwarden/platform-web run e2e:portals
      - uses: actions/upload-artifact@v4
        with:
          name: rushwarden-portals-${{ github.sha }}
          path: packages/platform-web/portals/*.zip
          if-no-files-found: error
          retention-days: 14

  ui-e2e:
    # The run screen's own e2e on packages/ui's dev page (hooks H2, H3, H5), split out of the web
    # job. It takes ~7 min; the timeout is ~2× that.
    name: Run screen e2e (UI, phone and desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rushwarden/ui exec playwright install --with-deps chromium
      - name: Run screen e2e (hooks H2, H3, H5; phone and desktop)
        run: pnpm --filter @rushwarden/ui run e2e

  toy-e2e:
    # ADR-029: the toy specs that play whole rounds or runs (tagged @full), on the 390x844
    # Chromium phone only, in parallel with the web job. WebKit runs them in Nightly.
    name: Toy e2e, full rounds (phone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the public web build (the e2e preview serves it)
        run: pnpm --filter @rushwarden/platform-web run build
      - run: pnpm --filter @rushwarden/platform-web exec playwright install --with-deps chromium
      - name: Toy e2e (@full, phone)
        run: pnpm --filter @rushwarden/platform-web run e2e --project phone --grep @full
