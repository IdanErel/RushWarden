name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit, golden (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests with coverage gates, including golden hashes on Node
        run: pnpm test

  golden-browsers:
    name: Golden hashes (Chromium, WebKit, Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rushwarden/golden exec playwright install --with-deps chromium webkit firefox
      - run: pnpm golden:browsers

  web:
    name: Web build, size budget, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and check bundle budget
        run: pnpm size
      - run: pnpm --filter @rushwarden/platform-web exec playwright install --with-deps chromium
      - name: E2E (phone and desktop viewports)
        run: pnpm --filter @rushwarden/platform-web run e2e
      # P1-PLT-01: itch HTML5 zip (itch flavour, size-, map- and hook-checked). Builds to its own dir.
      - name: Package itch zip
        run: pnpm --filter @rushwarden/platform-web run package:itch
      - uses: actions/upload-artifact@v4
        with:
          name: rushwarden-itch-${{ github.sha }}
          path: packages/platform-web/itch/rushwarden-itch.zip
          if-no-files-found: error
          retention-days: 14

  pr-title:
    name: Conventional commit title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint PR title (squash-merge commit message)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint
